services:
  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - '5183:5183'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 5183"

volumes:
  node_modules:
